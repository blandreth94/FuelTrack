<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FuelTrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="camera-container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status-bar">
    <span id="fps-spacer"></span>
    <span id="status-text">Press Start to begin tracking</span>
    <span id="fps-text"></span>
  </div>

  <div id="controls">
    <div id="camera-row">
      <label id="camera-label" for="camera-select">Camera</label>
      <select id="camera-select"></select>
    </div>
    <div id="zoom-row">
      <label id="zoom-label" for="zoom-slider">Zoom</label>
      <input id="zoom-slider" type="range" min="1" max="4" step="0.05" value="1" />
      <span id="zoom-value">1×</span>
    </div>
    <div id="button-row">
      <button id="btn-track" class="btn btn-primary">Start Tracking</button>
      <button id="btn-reset" class="btn btn-secondary">Reset</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
